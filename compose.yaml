services:
  postgres15:
    container_name: postgres15
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "Atlantic/Cape_Verde"
    volumes:
      - pg15_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432
    networks:
      - todolist-network

  #todolist-app:
    #container_name: todolist-app
    #build: .
    #image: todolist-app:0.0.0
    #ports:
    #  - 3000:3000
    #env_file: .env
    #networks:
     # - todolist-network


  postgres_todolist:
    container_name: postgres_todolist
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: djeison
      TZ: "Atlantic/Cape_Verde"
    volumes:
      - postgres_test:/var/lib/postgresql/data/
    ports:
      - 5432:5432 

  pgadmin4:
    image: dpage/pgadmin4:9.2
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - 5050:80
    restart: unless-stopped
    volumes:
      - pgadmin-2025:/var/lib/pgadmin
    networks:
      - todolist-network

volumes:
  pg15_data:
    name: pg15_data

  postgres_test:
    name: postgres_test

  pgadmin-2025:
    name: pgadmin-2025

networks:
  todolist-network:
    name: todolist-network
    external: true